name: release-cli

on:
  push:
    tags: ['cli/v*']

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.22'
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#cli/v}" >> "$GITHUB_ENV"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-s -w -X github.com/premex-ab/memoria-cli/internal/version.Version=${VERSION}" \
            -o memoria-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/memoria
      - uses: actions/upload-artifact@v4.4.0
        with:
          name: memoria-${{ matrix.goos }}-${{ matrix.goarch }}
          path: memoria-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.4.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.0.4
        with:
          files: dist/memoria-*
          fail_on_unmatched_files: true
          generate_release_notes: true
